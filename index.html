async function previewImport(){let f=$('#salesFile').files[0];if(!f){ping('เลือกไฟล์ก่อนค่ะ',true);return}try{let wb;if(f.name.toLowerCase().endsWith('.csv')){let text=await f.text();wb=XLSX.read(text,{type:'string'})}else{wb=XLSX.read(await f.arrayBuffer(),{type:'array'})}const salesSheet=wb.Sheets['Sales Import']||wb.Sheets[wb.SheetNames[0]];let data=XLSX.utils.sheet_to_json(salesSheet,{defval:''});if(!data.length)throw Error('ไม่พบข้อมูลในชีต Sales Import');let norm=s=>String(s).trim().toLowerCase().replace(/[ _-]/g,'');let keymap=Object.keys(data[0]).reduce((a,k)=>(a[norm(k)]=k,a),{});const find=(...names)=>names.map(n=>keymap[norm(n)]).find(Boolean);let itemK=find('Item_Code','Item Code','Product Code'),custK=find('Customer_Code','Customer Code'),qtyK=find('Qty','Quantity'),qtyKgK=find('Qty_KG','Qty KG','Quantity KG'),uomK=find('UOM','Unit'),dateK=find('Sales_Date','Report_Date','Date');if(!itemK||!custK||(!qtyK&&!qtyKgK))throw Error('หัวตารางต้องมี Item_Code, Customer_Code และ Qty + UOM หรือ Qty_KG');let items=new Map(rows('items').map(x=>[String(x.Item_Code),x])),customers=new Map(rows('customers').map(x=>[String(x.Customer_Code),x]));staged=data.map((r,i)=>{let item=items.get(String(r[itemK]||'').trim()),cust=customers.get(String(r[custK]||'').trim()),inputQty=Number(String(r[qtyK||qtyKgK]??'').replace(/,/g,'')),uom=String(uomK?r[uomK]||'':'').trim(),err=[],factor=0;if(!item)err.push('Item ไม่พบ');if(!cust)err.push('Customer ไม่พบ');if(!(inputQty>0))err.push('Qty ไม่ถูกต้อง');if(uom){const conv=actualUomConversion(item,uom);factor=conv.factor;if(conv.error)err.push(conv.error)}else{factor=1;uom='KG'}if(!(factor>0))err.push('Conversion KG_Per_UOM ไม่ถูกต้อง');const kg=inputQty*factor;return {source:i+2,item,cust,q:kg,inputQty,uom,factor,date:dateK?String(r[dateK]).slice(0,10):$('#reportDate').value,err}});let good=staged.filter(x=>!x.err.length);$('#importPreview').innerHTML=`<div class="notice ${good.length!==staged.length?'alert':''}">ตรวจแล้ว ${staged.leng async function commitImport(filename){let date=$('#reportDate').value,good=staged.filter(x=>!x.err.length);if(rows('actuals').some(a=>normDate(a.Sales_Date)===date&&String(a.Data_Status||'').toUpperCase()==='LIVE')&&!confirm(`มี Actual วันที่ ${date} อยู่แล้ว ต้องการแทนที่ทั้งวันใช่ไหม?`))return;try{let batch=id('BATCH'),newRows=good.map(x=>({Actual_ID:id('ACT'),Sales_Date:date,Import_Batch_ID:batch,Item_Code:x.item.Item_Code,Customer_Code:x.cust.Customer_Code,Sale_ID:x.cust.Assigned_Sale_ID,Qty_KG:x.q,Qty_MT:x.q/1000,Source_Row:x.source,Match_Status:'MATCHED',Data_Status:'LIVE',Record_Key:`${batch}|${x.source}`,Channel:x.cust.Channel||rows('sales').find(s=>s.Sale_ID===x.cust.Assigned_Sale_ID)?.Channel||'',UOM:x.uom,Qty:x.inputQty,KG_Per_UOM:x.factor}));let oldRows=rows('actuals').filter(a=>normDate(a.Sales_Date)===date&&String(a.Data_Status||'LIVE').toUpperCase()==='LIVE').map(a=>a._row);await append(TAB.actuals,newRows);if(oldRows.length)await api('values:batchClear',{ranges:oldRows.map(n=>`'${TAB.actuals}'!A${n}:P${n}`)});let kg=newRows.reduce((sum,a)=>sum+a.Qty_KG,0);await append(TAB.importLog,[{Import_Batch_ID:batch,Report_Date:date,File_Name:filename,Rows_Received:staged.length,Rows_Accepted:newRows.length,Rows_Rejected:staged.length-newRows.length,Total_KG:kg,Total_MT:kg/1000,Imported_By:me,Import_Status:'IMPORTED',Replace_Scope:`Report_Date = ${date}`,Data_Status:'LIVE'}]);ping('Import สำเร็จ');await loadDb()}catch(e){ping(e.message,true)}}
